<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>设计参考库</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>设计参考库</h1>
        <p class="count" id="count" aria-live="polite">正在加载…</p>
      </div>
      <button type="button" class="icon-btn" id="token-btn" aria-label="令牌设置" title="令牌设置">
        <svg id="token-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/>
        </svg>
      </button>
    </div>
    <div class="chips" id="cat-bar" role="toolbar" aria-label="分类"></div>
    <div class="chips" id="sub-bar" role="toolbar" aria-label="子分类" hidden></div>
    <div class="tools">
      <label class="select-wrap">标签
        <select id="tag-select" aria-label="按标签筛选"></select>
      </label>
      <input id="search" type="search" placeholder="搜索标题、备注或标签" autocomplete="off" enterkeyhint="search">
    </div>
  </header>
  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>没有匹配的图片</p>
  <button type="button" id="fab" class="fab" hidden aria-label="上传图片">+</button>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" multiple hidden>
  <div id="drop-overlay" class="drop-overlay" hidden>松开即可上传</div>
  <div id="lightbox" class="lb" hidden role="dialog" aria-modal="true" aria-label="图片详情">
    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-close" id="lb-close" aria-label="关闭">×</button>
      <img id="lb-img" alt="">
    </div>
    <div class="lb-panel" id="lb-panel"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="lib.js"></script>
  <script src="site.js"></script>
</body>
</html>
